name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Gerar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CleanGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
