name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK Platform 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-36" || echo "Aviso: o Gradle vai baixar a plataforma sozinho."
          else
            echo "sdkmanager não encontrado; o Gradle vai baixar a plataforma sozinho."
          fi

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Gerar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CleanGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
